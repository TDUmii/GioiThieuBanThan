{% macro icon(name, label='') -%}
<svg class="icon icon--{{ name }}" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %}>
  {% if name == 'terminal' %}
    <rect x="5" y="8" width="38" height="32" rx="6" stroke="currentColor" stroke-width="2.2"/>
    <path d="M12 18L18 24L12 30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M23 30H34" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  {% elif name == 'arrow-up-right' %}
    <path d="M13 35L35 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M18 13H35V30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'route' %}
    <path d="M10 35C10 27 16 26 21 26H29C34 26 38 23 38 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="10" cy="35" r="4" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="38" cy="12" r="4" stroke="currentColor" stroke-width="2.2"/>
    <path d="M20 14L24 10L28 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'school' %}
    <path d="M7 20L24 11L41 20L24 29L7 20Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M12 24V34C19 39 29 39 36 34V24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M41 20V31" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="41" cy="34" r="2" fill="currentColor"/>
  {% elif name == 'atom' %}
    <ellipse cx="24" cy="24" rx="18" ry="8" transform="rotate(28 24 24)" stroke="currentColor" stroke-width="2.2"/>
    <ellipse cx="24" cy="24" rx="18" ry="8" transform="rotate(-28 24 24)" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="24" cy="24" r="3.5" fill="currentColor"/>
  {% elif name == 'shield' %}
    <path d="M24 6L39 12V23C39 33 32 39 24 42C16 39 9 33 9 23V12L24 6Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M18 24L22 28L31 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'presentation' %}
    <rect x="8" y="8" width="32" height="23" rx="3" stroke="currentColor" stroke-width="2.2"/>
    <path d="M24 31V39" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M17 39H31" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M15 21L21 16L25 20L33 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'camera' %}
    <path d="M9 17H17L20 12H28L31 17H39C40.7 17 42 18.3 42 20V35C42 36.7 40.7 38 39 38H9C7.3 38 6 36.7 6 35V20C6 18.3 7.3 17 9 17Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="24" cy="27" r="7" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="35" cy="22" r="1.5" fill="currentColor"/>
  {% elif name == 'spark' %}
    <path d="M24 5L27 20L42 24L27 28L24 43L21 28L6 24L21 20L24 5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  {% elif name == 'paw' %}
    <ellipse cx="24" cy="31" rx="9" ry="7" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="13" cy="19" r="4" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="23" cy="14" r="4" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="34" cy="19" r="4" stroke="currentColor" stroke-width="2.2"/>
  {% elif name == 'flower' %}
    <circle cx="24" cy="25" r="4" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="24" cy="13" r="6" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="14" cy="21" r="6" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="34" cy="21" r="6" stroke="currentColor" stroke-width="2.2"/>
    <path d="M24 29V42" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M24 36C20 32 16 34 14 37" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  {% elif name == 'book' %}
    <path d="M8 10C14 9 19 11 24 15V39C19 35 14 33 8 34V10Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M40 10C34 9 29 11 24 15V39C29 35 34 33 40 34V10Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  {% elif name == 'close' %}
    <path d="M14 14L34 34M34 14L14 34" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  {% elif name == 'arrow-down' %}
    <path d="M24 9V38M13 27L24 38L35 27" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'arrow-left' %}
    <path d="M39 24H9M20 13L9 24L20 35" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'arrow-right' %}
    <path d="M9 24H39M28 13L39 24L28 35" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'expand' %}
    <path d="M8 19V8H19M29 8H40V19M40 29V40H29M19 40H8V29" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif name == 'menu' %}
    <path d="M9 14H39M9 24H39M9 34H39" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  {% endif %}
</svg>
{%- endmacro %}
